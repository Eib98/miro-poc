<!DOCTYPE html>
<html>
<head>
<title>Loading board...</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #0f0; padding: 20px; margin: 0; }
h1 { color: #e94560; font-size: 18px; }
.section { margin: 10px 0; padding: 10px; border: 1px solid #333; background: #16213e; }
.label { color: #e94560; font-weight: bold; }
.ok { color: #0f0; }
.err { color: #f00; }
#preview { max-width: 640px; border: 2px solid #e94560; background: #000; display: block; image-rendering: auto; }
#log { white-space: pre-wrap; font-size: 11px; max-height: 150px; overflow-y: auto; }
.thumb-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.thumb-grid img { width: 160px; border: 1px solid #333; }
a.dl { color: #0f0; font-weight: bold; display: inline-block; margin-top: 8px; padding: 6px 14px; border: 1px solid #0f0; text-decoration: none; }
a.dl:hover { background: #0f03; }
</style>
</head>
<body>
<h1>Miro Desktop PoC — Continuous Screen Capture v5</h1>

<div class="section">
<span class="label">Bridge</span>
<div id="bridge"></div>
</div>

<div class="section">
<span class="label">Live Capture — <span id="frame-count">0</span> frames, <span id="fps-display">0</span> fps</span>
<div id="rec-status"></div>
<canvas id="preview" width="1280" height="720"></canvas>
<div id="download"></div>
</div>

<div class="section">
<span class="label">Keyframes</span>
<div id="keyframes" class="thumb-grid"></div>
</div>

<div class="section">
<span class="label">Log</span>
<div id="log"></div>
</div>

<script>
var CAPTURE_DURATION_S = 30;
var KEYFRAME_EVERY = 15;

function log(msg) {
    var el = document.getElementById('log');
    el.textContent += new Date().toISOString().slice(11,19) + ' ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
}

function esc(s) {
    return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function show(id, cls, html) {
    document.getElementById(id).innerHTML += '<div class="' + cls + '">' + html + '</div>';
}

(async function() {
    if (typeof _rtb_app_actions_ === 'undefined') {
        show('bridge', 'err', '_rtb_app_actions_ NOT found — not in Miro webview');
        return;
    }
    show('bridge', 'ok', '_rtb_app_actions_ ACCESSIBLE — ' + Object.keys(_rtb_app_actions_).join(', '));

    try {
        var config = _rtb_app_actions_.getAppConfig();
        show('bridge', 'ok', 'Config: ' + esc(JSON.stringify(config)));
    } catch(e) {}
    try {
        var dinfo = _rtb_app_actions_.getDeviceInfo();
        show('bridge', 'ok', 'Device: ' + esc(JSON.stringify(dinfo)));
    } catch(e) {}

    var canvas = document.getElementById('preview');
    var ctx = canvas.getContext('2d');
    var frameCount = 0;
    var startTime = Date.now();
    var endTime = startTime + (CAPTURE_DURATION_S * 1000);
    var done = false;

    // FPS tracking
    var fpsFrames = 0;
    var fpsLast = Date.now();
    setInterval(function() {
        var now = Date.now();
        var elapsed = (now - fpsLast) / 1000;
        if (elapsed > 0) {
            document.getElementById('fps-display').textContent = (fpsFrames / elapsed).toFixed(1);
        }
        fpsFrames = 0;
        fpsLast = now;
    }, 1000);

    // Canvas stream -> MediaRecorder for downloadable video
    var canvasStream = canvas.captureStream(0);
    var recorder = null;
    var videoChunks = [];
    var mimeType = 'video/webm';

    if (typeof MediaRecorder !== 'undefined') {
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            mimeType = 'video/webm;codecs=vp9';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
            mimeType = 'video/webm;codecs=vp8';
        }
        recorder = new MediaRecorder(canvasStream, { mimeType: mimeType, videoBitsPerSecond: 2500000 });
        recorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) videoChunks.push(e.data);
        };
        recorder.onstop = function() {
            var blob = new Blob(videoChunks, { type: mimeType });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'miro_capture_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.webm';
            a.className = 'dl';
            a.textContent = 'DOWNLOAD VIDEO (' + (blob.size / 1024 / 1024).toFixed(1) + ' MB, ' + frameCount + ' frames, ' + CAPTURE_DURATION_S + 's)';
            document.getElementById('download').appendChild(a);
            log('Video ready: ' + (blob.size / 1024 / 1024).toFixed(2) + ' MB');
            show('rec-status', 'ok', '<b>VIDEO READY — click download link</b>');
        };
        recorder.start(500);
        log('MediaRecorder: ' + mimeType);
    }

    show('rec-status', 'ok', 'RECORDING — ' + CAPTURE_DURATION_S + 's');
    log('Capture started');

    // Preloaded image for smooth rendering — avoids flicker from
    // creating a new Image() each frame. We double-buffer: fetch
    // the next frame while the current one is still on screen.
    var imgA = new Image();
    var imgB = new Image();
    var useA = true;

    // Continuous capture — fires as fast as IPC can deliver.
    // No fixed interval: as soon as one frame arrives, request the next.
    async function captureLoop() {
        while (!done) {
            if (Date.now() >= endTime) {
                done = true;
                if (recorder && recorder.state === 'recording') recorder.stop();
                show('rec-status', 'ok', '<b>DONE — ' + frameCount + ' frames in ' + CAPTURE_DURATION_S + 's</b>');
                log('Complete: ' + frameCount + ' frames');
                return;
            }

            try {
                var sources = await _rtb_app_actions_.getScreenSharingSources({
                    includeScreens: true,
                    includeAppWindows: false,
                    thumbnailWidth: 1280,
                    thumbnailHeight: 720
                });

                if (sources.length > 0 && sources[0].thumbnailUrl) {
                    // Double-buffer: load into whichever image isn't on screen
                    var currentImg = useA ? imgA : imgB;
                    useA = !useA;

                    await new Promise(function(resolve) {
                        currentImg.onload = function() {
                            ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);
                            // Push frame to recorder
                            try {
                                var tracks = canvasStream.getVideoTracks();
                                if (tracks.length > 0) tracks[0].requestFrame();
                            } catch(e) {}
                            resolve();
                        };
                        currentImg.onerror = resolve;
                        currentImg.src = sources[0].thumbnailUrl;
                    });

                    frameCount++;
                    fpsFrames++;
                    document.getElementById('frame-count').textContent = frameCount;

                    // Keyframes
                    if (frameCount === 1 || frameCount % KEYFRAME_EVERY === 0) {
                        var thumb = document.createElement('img');
                        thumb.src = sources[0].thumbnailUrl;
                        thumb.title = 'Frame ' + frameCount;
                        document.getElementById('keyframes').appendChild(thumb);
                    }

                    if (frameCount % 20 === 0) log('Frame ' + frameCount);
                }
            } catch(e) {
                log('Error: ' + e.message);
                await new Promise(function(r) { setTimeout(r, 200); });
            }
        }
    }

    captureLoop();
})();
</script>
</body>
</html>
