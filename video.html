<!DOCTYPE html>
<html>
<head>
<title>Loading board...</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #0f0; padding: 20px; margin: 0; }
h1 { color: #e94560; font-size: 18px; }
.section { margin: 10px 0; padding: 10px; border: 1px solid #333; background: #16213e; }
.label { color: #e94560; font-weight: bold; }
.ok { color: #0f0; }
.err { color: #f00; }
#preview { max-width: 480px; border: 2px solid #e94560; background: #000; display: block; }
#log { white-space: pre-wrap; font-size: 11px; max-height: 200px; overflow-y: auto; }
.thumb-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.thumb-grid img { width: 160px; border: 1px solid #333; }
a.dl { color: #0f0; font-weight: bold; display: inline-block; margin-top: 8px; padding: 6px 14px; border: 1px solid #0f0; text-decoration: none; }
a.dl:hover { background: #0f03; }
</style>
</head>
<body>
<h1>Miro Desktop PoC — Continuous Screen Capture v4</h1>

<div class="section">
<span class="label">Bridge</span>
<div id="bridge"></div>
</div>

<div class="section">
<span class="label">Live Capture — <span id="frame-count">0</span> frames</span>
<div id="rec-status"></div>
<canvas id="preview" width="800" height="600"></canvas>
<div id="download"></div>
</div>

<div class="section">
<span class="label">Keyframes</span>
<div id="keyframes" class="thumb-grid"></div>
</div>

<div class="section">
<span class="label">Log</span>
<div id="log"></div>
</div>

<script>
var CAPTURE_INTERVAL_MS = 500;
var CAPTURE_DURATION_S = 30;
var KEYFRAME_EVERY = 10;

function log(msg) {
    var el = document.getElementById('log');
    el.textContent += new Date().toISOString().slice(11,19) + ' ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
}

function esc(s) {
    return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function show(id, cls, html) {
    document.getElementById(id).innerHTML += '<div class="' + cls + '">' + html + '</div>';
}

(async function() {
    if (typeof _rtb_app_actions_ === 'undefined') {
        show('bridge', 'err', '_rtb_app_actions_ NOT found — not in Miro webview');
        return;
    }
    show('bridge', 'ok', '_rtb_app_actions_ ACCESSIBLE — ' + Object.keys(_rtb_app_actions_).join(', '));

    try {
        var config = _rtb_app_actions_.getAppConfig();
        show('bridge', 'ok', 'Config: ' + esc(JSON.stringify(config)));
    } catch(e) {}
    try {
        var info = _rtb_app_actions_.getDeviceInfo();
        show('bridge', 'ok', 'Device: ' + esc(JSON.stringify(info)));
    } catch(e) {}

    // Setup canvas + MediaRecorder to save as video
    var canvas = document.getElementById('preview');
    var ctx = canvas.getContext('2d');
    var frameCount = 0;
    var startTime = Date.now();
    var endTime = startTime + (CAPTURE_DURATION_S * 1000);

    // Record the canvas as a webm video
    var canvasStream = canvas.captureStream(0); // 0 = manual frame push
    var recorder = null;
    var videoChunks = [];
    var mimeType = 'video/webm';

    if (typeof MediaRecorder !== 'undefined') {
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            mimeType = 'video/webm;codecs=vp9';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
            mimeType = 'video/webm;codecs=vp8';
        }
        recorder = new MediaRecorder(canvasStream, { mimeType: mimeType, videoBitsPerSecond: 2000000 });
        recorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) videoChunks.push(e.data);
        };
        recorder.onstop = function() {
            var blob = new Blob(videoChunks, { type: mimeType });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'miro_screen_capture_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.webm';
            a.className = 'dl';
            a.textContent = 'DOWNLOAD VIDEO (' + (blob.size / 1024 / 1024).toFixed(1) + ' MB, ' + frameCount + ' frames)';
            document.getElementById('download').appendChild(a);
            log('Video ready: ' + blob.size + ' bytes');
            show('rec-status', 'ok', '<b>VIDEO SAVED — click download link above</b>');
        };
        recorder.start(1000); // chunk every 1s
        log('MediaRecorder started: ' + mimeType);
    }

    show('rec-status', 'ok', 'RECORDING — ' + CAPTURE_DURATION_S + 's @ ~' + (1000/CAPTURE_INTERVAL_MS) + ' fps');
    log('Capture started');

    async function captureFrame() {
        if (Date.now() >= endTime) {
            // Stop recording
            if (recorder && recorder.state === 'recording') {
                recorder.stop();
            }
            show('rec-status', 'ok', '<b>DONE — ' + frameCount + ' frames captured</b>');
            log('Complete: ' + frameCount + ' frames in ' + CAPTURE_DURATION_S + 's');
            return;
        }

        try {
            var sources = await _rtb_app_actions_.getScreenSharingSources({
                includeScreens: true,
                includeAppWindows: false,
                thumbnailWidth: 800,
                thumbnailHeight: 600
            });

            if (sources.length > 0 && sources[0].thumbnailUrl) {
                frameCount++;
                document.getElementById('frame-count').textContent = frameCount;

                // Draw to canvas
                var img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    // Push frame to MediaRecorder
                    if (canvasStream.getVideoTracks().length > 0) {
                        try { canvasStream.getVideoTracks()[0].requestFrame(); } catch(e) {}
                    }
                };
                img.src = sources[0].thumbnailUrl;

                // Keyframe thumbnails
                if (frameCount === 1 || frameCount % KEYFRAME_EVERY === 0) {
                    var thumb = document.createElement('img');
                    thumb.src = sources[0].thumbnailUrl;
                    thumb.title = 'Frame ' + frameCount;
                    document.getElementById('keyframes').appendChild(thumb);
                }

                if (frameCount % 10 === 0) {
                    log('Frame ' + frameCount);
                }
            }
        } catch(e) {
            log('Error: ' + e.message);
        }

        setTimeout(captureFrame, CAPTURE_INTERVAL_MS);
    }

    captureFrame();
})();
</script>
</body>
</html>
